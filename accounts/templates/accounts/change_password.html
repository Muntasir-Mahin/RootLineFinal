{% extends 'base.html' %}
{% block content %}
<div class="workflow-page page-change-password">
<div class="account-form-wrap flex items-start justify-center">
<div class="bg-surface rounded-xl p-8 w-full max-w-lg ui-card">
<header class="page-heading"><p class="section-eyebrow">ACCOUNT SECURITY</p><h1>Change Password</h1><p class="page-description">A fresh password for peace of mind.</p></header>
<form method="POST" class="space-y-5 modern-form">
{% csrf_token %}
<div class="space-y-4">
{% include 'components/form_fields.html' %}
</div>
<button
type="submit"
class="w-full py-3 rounded-lg font-semibold transition primary-action"
>
Change Password
</button>
</form>
<a
href="{% url 'profile' %}"
class="block text-center mt-6 text-content font-semibold"
>
← Back to Profile
</a>
</div>
</div>
</div>
{% endblock %}
