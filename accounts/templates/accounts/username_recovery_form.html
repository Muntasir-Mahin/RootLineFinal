{% extends 'base.html' %}
{% block content %}
<div class="workflow-page"><div class="auth-layout agro-recovery-layout">{% include 'components/agro_auth_story.html' %}<div class="account-form-wrap"><section class="ui-card">
  <header class="page-heading"><p class="section-eyebrow">ACCOUNT RECOVERY</p><h1>Forgot username?</h1><p class="page-description">Enter the email address associated with your account.</p></header>
  <form method="POST" class="modern-form">{% csrf_token %}
    {% include 'components/form_fields.html' %}
    <button type="submit" class="primary-action full-action">Email my username(s)</button>
  </form>
  <p class="auth-switch"><a href="{% url 'login' %}">Back to login</a></p>
</section></div></div></div>
{% endblock %}
