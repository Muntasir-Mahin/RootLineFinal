{% extends 'partners/base.html' %}
{% block partner_title %}{{ product.name }} extra images{% endblock %}
{% block partner_content %}<section class="surface ui-card"><p>Up to six extra images, each no larger than 5 MB.</p><form class="modern-form" method="post" enctype="multipart/form-data">{% csrf_token %}{% include 'components/form_fields.html' %}<button class="primary-action" type="submit">Add image</button></form></section><div class="grid gap-6 md:grid-cols-3">{% for item in images %}<figure class="surface ui-card space-y-3"><img class="w-full h-48 object-cover rounded-lg" src="{{ item.image.url }}" alt="{{ item.caption }}"><figcaption>{{ item.caption }}</figcaption><form method="post" action="{% url 'partners:product_image_delete' item.pk %}">{% csrf_token %}<button class="outline-action" type="submit">Remove image</button></form></figure>{% endfor %}</div>{% endblock %}
