{% if page.has_other_pages %}<nav class="flex flex-wrap gap-4 items-center" aria-label="Pagination">{% if page.has_previous %}<a class="outline-action" href="{% querystring page=page.previous_page_number %}">Previous</a>{% endif %}<span>Page {{ page.number }} of {{ page.paginator.num_pages }}</span>{% if page.has_next %}<a class="outline-action" href="{% querystring page=page.next_page_number %}">Next</a>{% endif %}</nav>{% endif %}
