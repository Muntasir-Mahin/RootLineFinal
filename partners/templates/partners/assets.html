{% extends 'partners/base.html' %}
{% block partner_title %}Manage {{ kind }}{% endblock %}
{% block partner_content %}<a class="primary-action" href="{% url 'partners:asset_add' kind %}">Add {{ label }}</a><div class="grid gap-6 md:grid-cols-2">{% for item in items %}<article class="surface ui-card space-y-4"><h2>{{ item }}</h2>{% if item.image %}<img class="w-full h-48 object-cover rounded-lg" src="{{ item.image.url }}" alt="{{ item }}" loading="lazy">{% endif %}<div class="flex flex-wrap gap-3"><a class="outline-action" href="{% url 'partners:asset_edit' kind item.pk %}">Edit</a><a class="outline-action" href="{% url 'partners:asset_delete' kind item.pk %}">Delete</a></div></article>{% empty %}<p>No {{ kind }} added yet.</p>{% endfor %}</div>{% endblock %}
