{% load static %}

<!DOCTYPE html>
<html lang="en">


<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">


<title>
    RootLine
</title>



<link rel="stylesheet" href="{% static 'css/output.css' %}">
<link rel="stylesheet" href="{% static 'css/theme.css' %}">

<!-- Inline script runs before render to prevent white screen flash on dark mode reload -->
<script>
    (function() {
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    })();
</script>

<!-- Global Dark Theme Overrides -->
<style>
    :root {
        --bg-main: #f3f4f6;
        --bg-card: #ffffff;
        --text-main: #111827;
        --text-muted: #6b7280;
        --border-color: #e5e7eb;
        --input-bg: #ffffff;
        --nav-bg: #15803d;
        --nav-text: #ffffff;
    }

    html.dark {
        --bg-main: #111827;
        --bg-card: #1f2937;
        --text-main: #f9fafb;
        --text-muted: #9ca3af;
        --border-color: #374151;
        --input-bg: #374151;
        --nav-bg: #0f172a;
        --nav-text: #f8fafc;
    }

    /* Base layout overrides */
    body.rootline-app {
        background-color: var(--bg-main) !important;
        color: var(--text-main) !important;
        transition: background-color 0.2s ease, color 0.2s ease;
    }

    /* Navbar Dark Mode Styling */
    html.dark nav.site-nav,
    html.dark footer.site-footer {
        background-color: var(--nav-bg) !important;
        color: var(--nav-text) !important;
        border-bottom: 1px solid var(--border-color);
    }

    html.dark nav.site-nav a,
    html.dark nav.site-nav button {
        color: #e2e8f0 !important;
    }

    html.dark nav.site-nav a:hover,
    html.dark nav.site-nav button:hover {
        color: #4ade80 !important;
    }

    /* "My account" Button Fix in Dark Mode */
    html.dark nav.site-nav .nav-account {
        background-color: #1e293b !important;
        color: #ffffff !important;
        border: 1px solid #334155 !important;
    }

    html.dark nav.site-nav .nav-account:hover {
        background-color: #334155 !important;
        color: #4ade80 !important;
    }

    /* Cards, Panels, and Container Surfaces */
    html.dark .bg-white,
    html.dark .surface,
    html.dark .ui-card,
    html.dark .profile-panel,
    html.dark .shortcut,
    html.dark .settings-panel,
    html.dark .studio-card,
    html.dark .auth-panel {
        background-color: var(--bg-card) !important;
        color: var(--text-main) !important;
        border-color: var(--border-color) !important;
    }

    /* Form Inputs and Controls */
    html.dark input[type="text"],
    html.dark input[type="password"],
    html.dark input[type="email"],
    html.dark input[type="number"],
    html.dark input[type="date"],
    html.dark textarea,
    html.dark select {
        background-color: var(--input-bg) !important;
        color: var(--text-main) !important;
        border-color: var(--border-color) !important;
    }

    html.dark input::placeholder,
    html.dark textarea::placeholder {
        color: var(--text-muted) !important;
    }

    /* Typography Overrides */
    html.dark .text-gray-500,
    html.dark .text-gray-600,
    html.dark .page-description,
    html.dark .field-help {
        color: var(--text-muted) !important;
    }

    html.dark .text-gray-800,
    html.dark .text-gray-900,
    html.dark h1,
    html.dark h2,
    html.dark h3,
    html.dark h4 {
        color: var(--text-main) !important;
    }

    /* FIX: Preserve Dark Readable Text Inside Light Green Containers (Hero Banner, Seller Banner, Custom File Picker) */
    html.dark .seller-panel,
    html.dark .studio-banner,
    html.dark .seller-copy,
    html.dark [class*="hero"],
    html.dark [class*="banner"],
    html.dark .auth-story {
        background-color: #ecfdf5 !important;
        border-color: #a7f3d0 !important;
    }

    html.dark .seller-panel h1, html.dark .seller-panel h2, html.dark .seller-panel h3, html.dark .seller-panel p, html.dark .seller-panel span,
    html.dark .seller-copy h1, html.dark .seller-copy h2, html.dark .seller-copy h3, html.dark .seller-copy p, html.dark .seller-copy span,
    html.dark .studio-banner h1, html.dark .studio-banner h2, html.dark .studio-banner h3, html.dark .studio-banner p, html.dark .studio-banner span,
    html.dark [class*="hero"] h1, html.dark [class*="hero"] h2, html.dark [class*="hero"] h3, html.dark [class*="hero"] p, html.dark [class*="hero"] span,
    html.dark [class*="banner"] h1, html.dark [class*="banner"] h2, html.dark [class*="banner"] h3, html.dark [class*="banner"] p, html.dark [class*="banner"] span,
    html.dark .auth-story h1, html.dark .auth-story h2, html.dark .auth-story h3, html.dark .auth-story p, html.dark .auth-story span {
        color: #14532d !important;
    }

    html.dark div[style*="background-color: #f0fdf4"],
    html.dark div[style*="background-color: rgb(240, 253, 244)"] {
        background-color: #f0fdf4 !important;
        border-color: #bbf7d0 !important;
    }

    html.dark div[style*="background-color: #f0fdf4"] span,
    html.dark div[style*="background-color: rgb(240, 253, 244)"] span {
        color: #166534 !important;
    }

    /* Theme Toggle Button Styling */
    .theme-toggle-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 6px;
        border-radius: 8px;
        background-color: rgba(255, 255, 255, 0.15);
        color: #ffffff;
        border: 1px solid rgba(255, 255, 255, 0.2);
        cursor: pointer;
        transition: background-color 0.2s ease;
    }

    .theme-toggle-btn:hover {
        background-color: rgba(255, 255, 255, 0.25);
    }
</style>

</head>




<body class="rootline-app bg-gray-100 min-h-screen">





<!-- NAVBAR -->

<nav class="site-nav bg-green-700 text-white shadow-md" aria-label="Main navigation">

<div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">


    <!-- Logo -->

    <a href="{% url 'marketplace' %}"
       class="text-3xl font-bold">

        <span class="brand-mark">{% include 'components/icon.html' with name='leaf' %}</span> RootLine

    </a>




    <!-- Links -->

    <div class="flex gap-8 items-center">


        <a href="{% url 'marketplace' %}"
           class="hover:text-green-200">
            Marketplace
        </a>


        <a href="{% url 'auction_list' %}"
           class="hover:text-green-200">
            Auctions
        </a>



        {% if user.is_authenticated %}


        <a href="{% url 'cart' %}"
           class="hover:text-green-200">
            Cart
        </a>


        <a href="{% url 'my_orders' %}"
           class="hover:text-green-200">
            Orders
        </a>


        <a href="{% url 'profile' %}"
           class="nav-account hover:text-green-200">
            My account
        </a>


        <form method="POST" action="{% url 'logout' %}">
            {% csrf_token %}

            <button class="hover:text-red-300">

                Logout

            </button>

        </form>


        {% endif %}

        <!-- Dark/Light Theme Toggle Button -->
        <button id="theme-toggle" type="button" class="theme-toggle-btn" aria-label="Toggle theme">
            <!-- Sun Icon (Shown in Dark Mode) -->
            <svg id="theme-toggle-light-icon" style="width: 20px; height: 20px; display: none;" fill="currentColor" viewBox="0 0 20 20">
                <path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 100 2h1z" fill-rule="evenodd" clip-rule="evenodd"></path>
            </svg>
            <!-- Moon Icon (Shown in Light Mode) -->
            <svg id="theme-toggle-dark-icon" style="width: 20px; height: 20px; display: none;" fill="currentColor" viewBox="0 0 20 20">
                <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path>
            </svg>
        </button>


    </div>


</div>

</nav>




<!-- MAIN CONTENT -->


<main class="site-content container mx-auto p-6">



{% block content %}



{% endblock %}



</main>









<!-- FOOTER -->


<footer class="site-footer bg-green-700 text-white mt-10">


<div class="container mx-auto p-5 text-center">


<p>

© 2026 RootLine. Organic Marketplace Platform.

</p>


</div>


</footer>


<script>
    document.addEventListener("DOMContentLoaded", function () {
        const themeToggleBtn = document.getElementById('theme-toggle');
        const lightIcon = document.getElementById('theme-toggle-light-icon');
        const darkIcon = document.getElementById('theme-toggle-dark-icon');

        function updateIcons() {
            if (document.documentElement.classList.contains('dark')) {
                lightIcon.style.display = 'block';
                darkIcon.style.display = 'none';
            } else {
                lightIcon.style.display = 'none';
                darkIcon.style.display = 'block';
            }
        }

        updateIcons();

        themeToggleBtn.addEventListener('click', function () {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }
            updateIcons();
        });
    });
</script>

</body>


</html>
