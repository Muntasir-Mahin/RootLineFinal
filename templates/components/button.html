{% if href %}<a href="{{ href }}" class="{% if variant == 'secondary' %}outline-action{% elif variant == 'danger' %}danger-action{% else %}primary-action{% endif %}">{{ label }}</a>{% else %}<button type="{{ type|default:'button' }}" class="{% if variant == 'secondary' %}outline-action{% elif variant == 'danger' %}danger-action{% else %}primary-action{% endif %}">{{ label }}</button>{% endif %}
