<span class="product-rating" aria-label="Rated{{ rating|floatformat:1 }} out of 5
{% if count %}, {{ count }} reviews
{% endif %}">
    <span aria-hidden="true">★</span>
    {{ rating|floatformat:1 }}
    <span class="rating-count">
        {% if count %}({{ count }})
        {% endif %}
    </span>
</span>
